name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *' # This runs every night at 2:00 AM UTC
  workflow_dispatch: # Allows you to trigger a build manually anytime

permissions:
  contents: write

jobs:
  nightly:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        run: yarn install

      - name: Build Frontend Assets
        run: yarn build

      - name: Compile Windows Executable
        run: |
          mkdir dist
          go build -tags=json1 -o dist/xbvr.exe main.go
        env:
          CGO_ENABLED: 1

      - name: Update Nightly Release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          name: 'Nightly Build'
          body: 'Automated nightly build matching the latest master branch commits.'
          files: |
            dist/xbvr.exe
